[package]
name = "swbt-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Rust port of swbt-python for an NX-compatible virtual Bluetooth HID input device."
repository = "https://github.com/niart120/swbt-rs"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "/src/**",
    "/docs/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[lib]
name = "swbt"
path = "src/lib.rs"

[features]
default = []
adapter-tests = ["bumble"]
probe = ["bumble"]
bumble = [
    "dep:swbt-bumble-backend",
    "dep:rusb",
]

[dependencies]
atomic-write-file = "0.3.0"
fs2 = "0.4.3"
rusb = { version = "0.9.4", features = ["vendored"], optional = true }
serde_json = "1"
tracing = "0.1"
swbt-bumble-backend = { version = "=0.1.1", optional = true }

[[bin]]
name = "swbt-probe"
path = "src/bin/swbt-probe.rs"
required-features = ["probe"]
