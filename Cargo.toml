[workspace]
members = [
    "tools/swbt-hardware-runner",
    "tools/swbt-probe",
]
default-members = ["."]
resolver = "3"

[package]
name = "swbt-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Rust port of swbt-python for an NX-compatible virtual Bluetooth HID input device."
repository = "https://github.com/niart120/swbt-rs"
license = "MIT"
readme = "README.md"
publish = true
include = [
    "/src/**",
    "/docs/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[lib]
name = "swbt"
path = "src/lib.rs"

[features]
default = []
adapter-tests = ["bumble"]
diagnostics-schema = ["dep:tracing"]
bumble = [
    "dep:swbt-bumble-backend",
    "dep:rusb",
    "dep:tracing",
]

[dependencies]
atomic-write-file = "0.3.0"
rusb = { version = "0.9.4", features = ["vendored"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { version = "0.1", optional = true }
swbt-bumble-backend = { version = "=0.1.1", optional = true }
