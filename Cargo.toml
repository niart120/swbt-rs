[package]
name = "swbt-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Rust port of swbt-python for an NX-compatible virtual Bluetooth HID input device."
repository = "https://github.com/niart120/swbt-rs"
license = "MIT"
publish = false

[lib]
name = "swbt"
path = "src/lib.rs"

[features]
default = []
adapter-tests = ["bumble"]
bumble = [
    "dep:bumble-hci",
    "dep:bumble-host",
    "dep:bumble-transport",
    "dep:rusb",
    "dep:tracing",
]

[dependencies]
bumble-hci = { git = "https://github.com/niart120/bumble-rs", rev = "48f1bc36169b2692d2a61e87eda4223b126dca2b", optional = true }
bumble-host = { git = "https://github.com/niart120/bumble-rs", rev = "48f1bc36169b2692d2a61e87eda4223b126dca2b", optional = true }
bumble-transport = { git = "https://github.com/niart120/bumble-rs", rev = "48f1bc36169b2692d2a61e87eda4223b126dca2b", optional = true }
rusb = { version = "0.9.4", features = ["vendored"], optional = true }
serde_json = "1"
tracing = { version = "0.1", optional = true }
