[package]
name = "swbt-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Rust port of swbt-python for an NX-compatible virtual Bluetooth HID input device."
repository = "https://github.com/niart120/swbt-rs"
license = "MIT"
readme = "README.md"
publish = false
include = [
    "/src/**",
    "/docs/**",
    "/examples/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
]

[lib]
name = "swbt"
path = "src/lib.rs"

[features]
default = []
adapter-tests = ["bumble"]
probe = ["bumble"]
bumble = [
    "dep:bumble",
    "dep:bumble-controller",
    "dep:bumble-hci",
    "dep:bumble-hid",
    "dep:bumble-host",
    "dep:bumble-l2cap",
    "dep:bumble-sdp",
    "dep:bumble-transport",
    "dep:rusb",
]

[dependencies]
atomic-write-file = "0.3.0"
bumble = { version = "=0.1.0", package = "swbt-bumble", git = "https://github.com/niart120/bumble-rs", rev = "5fb0f6ddb811d1ad43dffa6e72a5d8cc6096fb07", optional = true }
bumble-controller = { version = "=0.1.0", package = "swbt-bumble-controller", git = "https://github.com/niart120/bumble-rs", rev = "5fb0f6ddb811d1ad43dffa6e72a5d8cc6096fb07", optional = true }
bumble-hci = { version = "=0.1.0", package = "swbt-bumble-hci", git = "https://github.com/niart120/bumble-rs", rev = "5fb0f6ddb811d1ad43dffa6e72a5d8cc6096fb07", optional = true }
bumble-hid = { version = "=0.1.0", package = "swbt-bumble-hid", git = "https://github.com/niart120/bumble-rs", rev = "5fb0f6ddb811d1ad43dffa6e72a5d8cc6096fb07", optional = true }
bumble-host = { version = "=0.1.0", package = "swbt-bumble-host", git = "https://github.com/niart120/bumble-rs", rev = "5fb0f6ddb811d1ad43dffa6e72a5d8cc6096fb07", optional = true }
bumble-l2cap = { version = "=0.1.0", package = "swbt-bumble-l2cap", git = "https://github.com/niart120/bumble-rs", rev = "5fb0f6ddb811d1ad43dffa6e72a5d8cc6096fb07", optional = true }
bumble-sdp = { version = "=0.1.0", package = "swbt-bumble-sdp", git = "https://github.com/niart120/bumble-rs", rev = "5fb0f6ddb811d1ad43dffa6e72a5d8cc6096fb07", optional = true }
bumble-transport = { version = "=0.1.0", package = "swbt-bumble-transport", git = "https://github.com/niart120/bumble-rs", rev = "5fb0f6ddb811d1ad43dffa6e72a5d8cc6096fb07", optional = true }
fs2 = "0.4.3"
rusb = { version = "0.9.4", features = ["vendored"], optional = true }
serde_json = "1"
tracing = "0.1"

[[bin]]
name = "swbt-probe"
path = "src/bin/swbt-probe.rs"
required-features = ["probe"]
