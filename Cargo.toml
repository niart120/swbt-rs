[package]
name = "swbt-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Rust port of swbt-python for an NX-compatible virtual Bluetooth HID input device."
repository = "https://github.com/niart120/swbt-rs"
license = "MIT"
publish = false

[lib]
name = "swbt"
path = "src/lib.rs"

[dependencies]
bumble = { git = "https://github.com/chaitanyarahalkar/bumble-rs", rev = "bbac2a6803b8cab0920ab725a23aa408fc4fed85" }
