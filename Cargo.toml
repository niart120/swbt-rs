[package]
name = "swbt-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Rust port of swbt-python for an NX-compatible virtual Bluetooth HID input device."
repository = "https://github.com/niart120/swbt-rs"
license = "MIT"
publish = false

[lib]
name = "swbt"
path = "src/lib.rs"

[features]
default = []
adapter-tests = ["bumble"]
bumble = [
    "dep:bumble",
    "dep:bumble-controller",
    "dep:bumble-hci",
    "dep:bumble-hid",
    "dep:bumble-host",
    "dep:bumble-l2cap",
    "dep:bumble-sdp",
    "dep:bumble-transport",
    "dep:rusb",
]

[dependencies]
atomic-write-file = "0.3.0"
bumble = { git = "https://github.com/niart120/bumble-rs", rev = "b8c7cd625bc2ac2f58a4beb4ade1264426969819", optional = true }
bumble-controller = { git = "https://github.com/niart120/bumble-rs", rev = "b8c7cd625bc2ac2f58a4beb4ade1264426969819", optional = true }
bumble-hci = { git = "https://github.com/niart120/bumble-rs", rev = "b8c7cd625bc2ac2f58a4beb4ade1264426969819", optional = true }
bumble-hid = { git = "https://github.com/niart120/bumble-rs", rev = "b8c7cd625bc2ac2f58a4beb4ade1264426969819", optional = true }
bumble-host = { git = "https://github.com/niart120/bumble-rs", rev = "b8c7cd625bc2ac2f58a4beb4ade1264426969819", optional = true }
bumble-l2cap = { git = "https://github.com/niart120/bumble-rs", rev = "b8c7cd625bc2ac2f58a4beb4ade1264426969819", optional = true }
bumble-sdp = { git = "https://github.com/niart120/bumble-rs", rev = "b8c7cd625bc2ac2f58a4beb4ade1264426969819", optional = true }
bumble-transport = { git = "https://github.com/niart120/bumble-rs", rev = "b8c7cd625bc2ac2f58a4beb4ade1264426969819", optional = true }
fs2 = "0.4.3"
rusb = { version = "0.9.4", features = ["vendored"], optional = true }
serde_json = "1"
tracing = "0.1"
