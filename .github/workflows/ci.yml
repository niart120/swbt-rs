name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check-msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
      - run: cargo check --workspace --all-targets --all-features --locked

  check-stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets --all-features --locked

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-targets --all-features --locked

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-targets --all-features --locked

  package-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p swbt-core --all-targets --locked
      - run: cargo build -p swbt-core --locked
      - run: cargo build -p swbt-rs --no-default-features --locked
      - name: Verify core and runtime dependency graphs
        shell: bash
        run: |
          core_tree="$(cargo tree -p swbt-core --edges normal --locked)"
          if grep -Eq '(swbt-bumble-backend|rusb v|tracing v|atomic-write-file)' <<<"${core_tree}"; then
            echo 'swbt-core must not contain runtime, USB, tracing, or profile writer dependencies.'
            exit 1
          fi
          runtime_tree="$(cargo tree -p swbt-rs --no-default-features --edges normal --locked)"
          for package in 'swbt-bumble-backend v' 'rusb v' 'tracing v'; do
            if ! grep -q "${package}" <<<"${runtime_tree}"; then
              echo "swbt-rs --no-default-features must contain ${package}."
              exit 1
            fi
          done

  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --doc --workspace --all-features --locked
      - run: cargo doc --no-deps --workspace --all-features --locked

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
          arguments: --locked
